<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TerraMind 0.2</title><style>*{box-sizing:border-box}body{margin:0;background:#101d20;color:#dbeae3;font:15px system-ui}header{padding:18px 24px;border-bottom:1px solid #344a48;letter-spacing:2px}main{display:grid;grid-template-columns:1fr 290px;height:calc(100dvh - 65px)}#view{position:relative;min-height:300px}aside{padding:20px;background:#192a2c;overflow:auto}input,button,select{background:#273e3d;border:1px solid #536c62;color:white;padding:10px;border-radius:7px;margin:4px 0}input{width:100%}button{cursor:pointer}small,pre{color:#a9c5b6}#log{white-space:pre-wrap}@media(max-width:700px){main{display:block;height:auto}#view{height:55vh}}</style><header>TERRAMIND · 虚实共生 <small>V0.2 / 世界实验室</small></header><main><div id="view"></div><aside><h3>生态监测</h3><pre id="stats"></pre><h3>世界指令</h3><input id="cmd" placeholder="点燃中央"><button id="run">执行指令</button><p><small>点燃中央 / 植树 12,20 / 降雨 0.01</small></p><div id="log"></div><h3>直接干预</h3><select id="tool"><option value="ignite">点燃</option><option value="plant">植树</option><option value="water">注水</option></select><p><small>Shift + 点击地形执行；拖动旋转，滚轮缩放</small></p><button id="pause">暂停 / 继续</button> <button id="undo">撤销至干预前</button> <button id="reset">重置</button><p><small>简化生态模型 · 本地规则解析（未接入 LLM）</small></p></aside></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module" src="./view.mjs"></script></html>
